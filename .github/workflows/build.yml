name: Build APKs
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build every zip in the repo
        run: |
          mkdir -p out
          for z in *.zip; do
            n="${z%.zip}"
            unzip -oq "$z" -d "proj/$n"
            d=$(ls -d proj/$n/*/ | head -1)
            (cd "$d" && gradle assembleDebug --no-daemon -q)
            cp "${d}app/build/outputs/apk/debug/app-debug.apk" "out/$n.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
